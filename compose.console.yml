name: dyfire
x-common: &common
  image: ${SPARK_IMAGE_NAME:-douyin-spark-console:local}
  build:
    context: .
    dockerfile: Dockerfile.console
    target: browser
    network: host
    args:
      PIP_INDEX_URL: ${SPARK_BUILD_PIP_INDEX_URL:-https://pypi.org/simple}
      WEB_RUNTIME_IMAGE: ${WEB_RUNTIME_IMAGE:-}
      BROWSER_RUNTIME_IMAGE: ${BROWSER_RUNTIME_IMAGE:-}
  restart: unless-stopped
  init: true
  env_file: .env.console
  volumes:
    - ./data:/data
    - ./secrets/cookie.key:/run/secrets/cookie.key:ro
    - ./secrets/session.key:/run/secrets/session.key:ro
  networks: [spark-private]
  read_only: true
  security_opt: ['no-new-privileges:true']
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  # Optional PostgreSQL target for isolated migration/replay drills. It is
  # never started by the default compose invocation and is not wired into the
  # production SQLite services automatically.
  postgres:
    image: postgres:16-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SPARK_POSTGRES_DB:-dyfire}
      POSTGRES_USER: ${SPARK_POSTGRES_USER:-dyfire}
      POSTGRES_PASSWORD: ${SPARK_POSTGRES_PASSWORD:-change-me-in-isolation}
    networks: [spark-private]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 0.50
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
  # Optional preparation service. It is never started by the default compose
  # invocation; enable it explicitly with --profile redis after setting
  # SPARK_REDIS_ENABLED=true and SPARK_REDIS_URL=redis://redis:6379/0.
  redis:
    image: redis:7.4-alpine
    profiles: [redis]
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --save, "60", "1"]
    networks: [spark-private]
    volumes:
      - redis-data:/data
    read_only: true
    security_opt: ['no-new-privileges:true']
    mem_limit: 128m
    cpus: 0.20
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  spark-web:
    <<: *common
    image: ${SPARK_WEB_IMAGE:-${SPARK_IMAGE_NAME:-douyin-spark-web:local}}
    build:
      context: .
      dockerfile: Dockerfile.console
      target: web
      args:
        WEB_RUNTIME_IMAGE: ${WEB_RUNTIME_IMAGE:-}
        BROWSER_RUNTIME_IMAGE: ${BROWSER_RUNTIME_IMAGE:-}
    environment:
      SPARK_HOST_METRICS_DIR: /run/host-metrics
      DYFIRE_UPDATE_DIR: /run/dyfire-updates
    volumes: &host-metrics-volumes
      - ./data:/data
      - ./secrets/cookie.key:/run/secrets/cookie.key:ro
      - ./secrets/session.key:/run/secrets/session.key:ro
      - /proc/stat:/run/host-metrics/stat:ro
      - /proc/meminfo:/run/host-metrics/meminfo:ro
      - /proc/loadavg:/run/host-metrics/loadavg:ro
      - /proc/uptime:/run/host-metrics/uptime:ro
      # statvfs on this file measures the host system disk without mounting /.
      - /etc/hostname:/run/host-metrics/rootfs:ro
      - ./updates:/run/dyfire-updates:ro
      - ./updates/requests:/run/dyfire-updates/requests:rw
    # Update requests are writable; host-owned status and deployment files are read-only.
    ports: ["${SPARK_WEB_PUBLISH_IP:-127.0.0.1}:8899:8899"]
    mem_limit: 256m
    cpus: 0.50
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8899/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  spark-monitor:
    <<: *common
    image: ${SPARK_MONITOR_IMAGE:-${SPARK_WEB_IMAGE:-${SPARK_IMAGE_NAME:-douyin-spark-web:local}}}
    build:
      context: .
      dockerfile: Dockerfile.console
      target: web
      args:
        WEB_RUNTIME_IMAGE: ${WEB_RUNTIME_IMAGE:-}
        BROWSER_RUNTIME_IMAGE: ${BROWSER_RUNTIME_IMAGE:-}
    command: [python, -m, spark_console.ops_history]
    environment:
      SPARK_HOST_METRICS_DIR: /run/host-metrics
    # The collector needs metrics and its history database, no account keys or
    # writable update channel.
    volumes:
      - ./data:/data
      - /proc/stat:/run/host-metrics/stat:ro
      - /proc/meminfo:/run/host-metrics/meminfo:ro
      - /proc/loadavg:/run/host-metrics/loadavg:ro
      - /proc/uptime:/run/host-metrics/uptime:ro
      - /etc/hostname:/run/host-metrics/rootfs:ro
    mem_limit: 128m
    cpus: 0.20
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    healthcheck:
      test: [CMD, python, -m, spark_console.ops_history, --health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  spark-auth:
    <<: *common
    image: ${SPARK_BROWSER_IMAGE:-${SPARK_IMAGE_NAME:-douyin-spark-browser:local}}
    command: [python, -m, spark_console.auth_worker]
    environment:
      SPARK_AUTH_POLL_SECONDS: "1"
    volumes:
      - ./data:/data
      - ./secrets/cookie.key:/run/secrets/cookie.key:ro
    mem_limit: 768m
    cpus: 1.0
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    healthcheck:
      test: [CMD, python, -m, spark_console.runtime_health, auth]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  spark-worker:
    <<: *common
    image: ${SPARK_BROWSER_IMAGE:-${SPARK_IMAGE_NAME:-douyin-spark-browser:local}}
    command: [python, -m, spark_console.worker]
    environment:
      SPARK_WORKER_CONCURRENCY: "1"
      SPARK_HEALTH_RETRY_WINDOW_MINUTES: "20"
    volumes:
      - ./data:/data
      - ./secrets/cookie.key:/run/secrets/cookie.key:ro
    mem_limit: 768m
    cpus: 1.0
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    healthcheck:
      test: [CMD, python, -m, spark_console.runtime_health, worker]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  spark-data:
  redis-data:
  postgres-data:
networks:
  spark-private:
    driver: bridge
