{% extends "base.html" %}{% block content %}
<div class="security-page">
<section class="auth-card security-card">{{ heading('设置你自己的密码' if user.must_change_password else '修改密码', '05 / SECURITY', '输入当前密码，并设置新的登录密码') }}
{% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
<form method="post" class="stack" data-submit-lock data-submitting-label="正在保存…">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="form-field">
    <label for="current-password">当前密码</label>
    <span class="password-field" data-password-field>
      <input id="current-password" type="password" name="current_password" autocomplete="current-password" data-password-input required>
      <button class="password-visibility-toggle" type="button" data-password-toggle aria-controls="current-password" aria-label="显示密码" aria-pressed="false" title="显示密码"><span class="password-eye-show">{{ icon('eye', 18) }}</span><span class="password-eye-hide">{{ icon('eye-off', 18) }}</span></button>
    </span>
  </div>
  <div class="form-field">
    <label for="new-password">新密码</label>
    <span class="password-field" data-password-field>
      <input id="new-password" type="password" name="new_password" autocomplete="new-password" minlength="12" maxlength="256" data-password-input required>
      <button class="password-visibility-toggle" type="button" data-password-toggle aria-controls="new-password" aria-label="显示密码" aria-pressed="false" title="显示密码"><span class="password-eye-show">{{ icon('eye', 18) }}</span><span class="password-eye-hide">{{ icon('eye-off', 18) }}</span></button>
    </span>
    <small class="muted">至少 12 位，包含字母和数字；请勿使用常见、连续或重复模式</small>
  </div>
  <div class="form-field">
    <label for="new-password-confirmation">确认新密码</label>
    <span class="password-field" data-password-field>
      <input id="new-password-confirmation" type="password" name="new_password_confirmation" autocomplete="new-password" minlength="12" maxlength="256" data-password-input required>
      <button class="password-visibility-toggle" type="button" data-password-toggle aria-controls="new-password-confirmation" aria-label="显示密码" aria-pressed="false" title="显示密码"><span class="password-eye-show">{{ icon('eye', 18) }}</span><span class="password-eye-hide">{{ icon('eye-off', 18) }}</span></button>
    </span>
  </div>
  <button>{{ '保存并进入控制台' if user.must_change_password else '保存新密码' }}</button>
</form></section>
</div>
{% endblock %}
