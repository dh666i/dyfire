{% extends "base.html" %}
{% block content %}
<div class="studio-auth-layout">
{% include 'studio_auth_art.html' %}
    <section class="auth-card auth-card-premium">
      <nav class="studio-auth-tabs" aria-label="账户入口"><a href="/login" aria-current="page">登录</a><a href="/register">注册</a></nav>
      <div class="auth-card-heading">
        <h2>欢迎回来</h2>
      </div>
      {% if registered %}<div class="notice good-notice auth-feedback" role="status"><span aria-hidden="true">✓</span><span>注册成功，请登录后兑换会员时长。</span></div>{% endif %}
      {% if error %}<div class="form-error auth-feedback" role="alert"><span aria-hidden="true">!</span><span>{{ error }}</span></div>{% endif %}
      <form method="post" class="stack auth-form" data-submit-lock data-submitting-label="正在登录…">
        <label class="auth-field">登录账号<input name="username" value="{{ username_value|default('') }}" autocomplete="username" placeholder="输入用户名或邮箱" required autofocus></label>
        <div class="form-field auth-field">
          <label for="login-password">密码</label>
          <span class="password-field" data-password-field>
            <input id="login-password" type="password" name="password" autocomplete="current-password" placeholder="输入密码" data-password-input required>
            <button class="password-visibility-toggle" type="button" data-password-toggle aria-controls="login-password" aria-label="显示密码" aria-pressed="false" title="显示密码"><span class="password-eye-show">{{ icon('eye', 18) }}</span><span class="password-eye-hide">{{ icon('eye-off', 18) }}</span></button>
          </span>
        </div>
        <button class="auth-submit" type="submit"><span>登录</span>{{ icon('arrow', 18) }}</button>
      </form>
      <div class="auth-card-footer">
        <p class="auth-link"><a href="/forgot-password">忘记网站密码？</a></p>
        <p class="auth-link">还没有账号？<a href="/register">立即注册</a></p>
        <p class="fine">请勿与他人共享平台密码或抖音登录信息。</p>
      </div>
    </section>
</div>
{% endblock %}
