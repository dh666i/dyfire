{% extends "base.html" %}{% block content %}
<section class="task-edit-page">
  <div class="task-edit-card panel">
    <a class="edit-back" href="/tasks">← 返回任务列表</a>
    <header class="edit-heading">
      <div><span class="eyebrow">修改计划</span><h1>编辑续火任务</h1><p>修改后会重新计算下一次发送时间，任务的启用状态保持不变。</p></div>
      <span class="pill {{ 'good' if task.enabled else 'off' }}">{{ '已启用' if task.enabled else '已暂停' }}</span>
    </header>
    {% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" class="stack edit-task-form" data-submit-lock data-submitting-label="正在保存…">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input id="task-target-sec-uid" type="hidden" name="target_sec_uid" value="{{ form.target_sec_uid }}">
      <div class="edit-form-grid">
        <label>发送账号
          <select id="task-account" name="account_id" required>{% for account in accounts %}<option value="{{ account.id }}"{% if account.id == form.account_id %} selected{% endif %}>{{ account.display_name }}</option>{% endfor %}</select>
        </label>
        <label>每天发送时间
          <input type="time" name="send_time" value="{{ form.send_time }}" required>
        </label>
      </div>
      <label>目标好友
        <div class="target-picker"><input id="task-target" name="target_name" value="{{ form.target_name }}" list="task-target-options" maxlength="256" autocomplete="off" placeholder="选择好友，或手动输入昵称" required><button id="refresh-targets" class="quiet" type="button">{{ icon('refresh', 17) }}刷新好友列表</button></div>
        <datalist id="task-target-options"></datalist>
        <small id="target-status" class="field-hint" role="status">正在读取已保存的好友列表…</small>
      </label>
      <label>消息类型
        <select id="task-message-kind" name="message_kind">
          <option value="text"{% if form.message_kind != 'douyin_sticker' %} selected{% endif %}>文字消息</option>
          <option value="douyin_sticker"{% if form.message_kind == 'douyin_sticker' %} selected{% endif %}>抖音原生表情 · 续火花</option>
        </select>
      </label>
      <div id="task-message-text-field"><label for="task-message">消息内容
        <textarea id="task-message" name="message_template" maxlength="500" rows="6" required>{{ form.message_template }}</textarea>
        <small class="field-hint field-counter"><span id="task-message-count">{{ form.message_template|length }}</span>/500 字</small>
      </label></div>
      <div id="task-message-sticker-field" class="native-sticker-choice"{% if form.message_kind != 'douyin_sticker' %} hidden{% endif %}><span class="field-label">原生表情</span><div class="native-sticker-preview" role="status" aria-label="将发送抖音原生续火花表情"><span aria-hidden="true">✦</span>续火花</div><small class="field-hint">发送时会从抖音表情面板选择原生表情，不会发送普通文字。</small></div>
      <div class="edit-actions"><a class="button quiet" href="/tasks">取消</a><button type="submit">保存修改</button></div>
    </form>
  </div>
</section>
<script defer src="/static/tasks.js?v=20260909-1"></script>
{% endblock %}
