<header class="studio-header">
  <a class="studio-brand" href="/studio" aria-label="火花，返回任务">{% include "studio_logo.html" %}<span>火花<sup>®</sup></span></a>
  {% if user is defined %}<nav class="studio-main-nav" aria-label="主导航"><a href="/studio"{% if '/tasks' in request.url.path %} aria-current="page"{% endif %}>续火任务 <sup>01</sup></a><a href="/accounts"{% if request.url.path=='/accounts' %} aria-current="page"{% endif %}>抖音账号 <sup>02</sup></a><a href="/runs"{% if request.url.path=='/runs' %} aria-current="page"{% endif %}>执行记录 <sup>03</sup></a></nav>{% endif %}
  <div class="studio-header-end"><button type="button" class="studio-theme" data-studio-theme aria-label="切换深浅色模式">◐</button>
  {% if user is defined %}<details class="studio-profile"><summary aria-label="打开账户菜单">{{ user.username[0]|upper }}</summary><div class="studio-profile-menu"><div class="menu-identity"><strong>{{ user.username }}</strong><small>{{ '管理员' if is_admin else '个人工作台' }}</small></div><a href="/studio?view=overview">今日概览</a><a href="/subscription">会员订阅</a><a href="/account-center">账户中心</a><a href="/notifications">通知设置</a><a href="/attention">待处理事项</a><a href="/help">使用帮助</a>{% if is_admin %}<a href="/admin/overview">管理后台 ↗</a><a href="/studio?view=updates">版本更新 ↗</a>{% endif %}<form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button type="submit">退出登录</button></form></div></details>{% else %}<a href="/login">登录</a>{% endif %}
  </div>
</header>
