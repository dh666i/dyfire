name: Build and publish release image
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: dyfire-release
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  release:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        id: version
        shell: python
        run: |
          import json, os, re
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          package = json.loads(Path('frontend/package.json').read_text())
          assert package.get('version') == version, 'frontend/package.json version must match VERSION'
          ref = os.environ.get('GITHUB_REF_NAME', '')
          if ref.startswith('v'):
              assert ref[1:] == version, f'tag {ref} does not match VERSION {version}'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
      - name: Weekly maintained runtime cache
        id: runtime
        shell: python
        run: |
          import os
          from datetime import datetime, timezone
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('refresh=' + datetime.now(timezone.utc).strftime('%G-W%V') + '\n')
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          file: Dockerfile.console
          push: true
          pull: true
          build-args: RUNTIME_REFRESH=${{ steps.runtime.outputs.refresh }}
          tags: ghcr.io/dh666i/dyfire:${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true
          labels: org.opencontainers.image.source=https://github.com/dh666i/dyfire
          cache-from: |
            type=registry,ref=ghcr.io/dh666i/dyfire:buildcache
            type=gha,scope=dyfire-console
            type=gha
          cache-to: |
            type=registry,ref=ghcr.io/dh666i/dyfire:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
            type=gha,scope=dyfire-console,mode=max
      - name: Verify release container
        env:
          RELEASE_IMAGE: ghcr.io/dh666i/dyfire@${{ steps.image.outputs.digest }}
        run: docker run --rm --entrypoint python -v "$PWD/deploy/smoke.py:/app/smoke.py:ro" "$RELEASE_IMAGE" /app/smoke.py
      - uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          image-ref: ghcr.io/dh666i/dyfire@${{ steps.image.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Publish verified release
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: python
        run: |
          import json, os, subprocess
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          manifest = {'version': version, 'schema': 1, 'image': 'ghcr.io/dh666i/dyfire@' + os.environ['RELEASE_DIGEST']}
          body = 'Dyfire ' + version + '\n\n镜像已由 GitHub Actions 构建并通过容器健康检查。服务器更新器只会安装此 Release 中记录的固定镜像摘要。\n\n<!-- dyfire-manifest ' + json.dumps(manifest) + ' -->\n'
          Path('release-notes.tmp').write_text(body, encoding='utf-8')
          tag = 'v' + version
          existing = subprocess.run(['gh', 'release', 'view', tag], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          if existing.returncode == 0:
              subprocess.run(['gh', 'release', 'edit', tag, '--title', 'Dyfire ' + version, '--notes-file', 'release-notes.tmp', '--draft=false', '--prerelease=false'], check=True)
          else:
              subprocess.run(['gh', 'release', 'create', tag, '--target', os.environ['GITHUB_SHA'], '--title', 'Dyfire ' + version, '--notes-file', 'release-notes.tmp'], check=True)
