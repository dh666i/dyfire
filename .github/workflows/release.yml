name: Build and publish private release image
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: dyfire-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dyfire
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d dyfire"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt -r requirements-console.txt pytest
      - name: Verify original-account recovery and browser login lifecycle
        run: python -m pytest tests/console/test_auth_recovery.py tests/console/test_auth_scanner.py tests/console/test_auth_worker.py tests/console/test_scan_sessions.py tests/console/test_account_health.py tests/console/test_credentials.py::CredentialPayloadTests tests/console/test_session_recovery.py -q
      - run: node --test frontend/src/navigation.test.js frontend/src/contact-picker-state.test.js
      - run: node tests/console/admin_mobile_layout_harness.cjs
      - run: node tests/console/cloud_frame_state_harness.cjs transient-errors-stay-loading
      - run: node tests/console/cloud_frame_state_harness.cjs timeout-is-explicit
      - run: node tests/console/cloud_frame_state_harness.cjs expiry-is-explicit
      - run: node tests/console/cloud_frame_state_harness.cjs retry-keeps-scan-id
      - run: python -m pytest tests/console/test_directory.py tests/console/test_release_updates.py tests/console/test_scheduler_sql.py tests/console/test_worker_sharding.py tests/console/test_studio_api.py tests/console/test_subscriptions.py tests/console/test_updater_host.py tests/console/test_recovery_drill.py tests/console/test_elevation_web.py tests/console/test_mfa.py tests/console/test_audit_traceability.py tests/console/test_password_policy_web.py tests/console/test_spa_bootstrap_perf.py tests/console/test_admin_web.py tests/console/test_services.py tests/console/test_config_db.py tests/console/test_crypto_security.py tests/console/test_retention.py tests/console/test_data_migration.py tests/console/test_postgres_schema.py tests/console/test_redis_backend.py tests/console/test_queue_preflight.py tests/console/test_backup_manifest.py tests/console/test_rate_limit.py tests/test_deployment_paths.py tests/test_postgres_profile.py -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dyfire
          TEST_REDIS_URL: redis://localhost:6379/15
      - name: Verify customer capacity and account-state preservation
        run: python -m pytest tests/console/test_scale_baseline.py tests/console/test_postgres_scale_baseline.py tests/console/test_postgres_claim_concurrency.py tests/console/test_account_scan_web.py tests/console/test_postgres_migration.py tests/console/test_request_context.py tests/console/test_request_limits.py tests/console/test_proxy_headers.py -q -s
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dyfire
      - name: Validate version
        id: version
        shell: python
        run: |
          import json, os, re
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          package = json.loads(Path('frontend/package.json').read_text())
          assert package.get('version') == version, 'frontend/package.json version must match VERSION'
          ref = os.environ.get('GITHUB_REF_NAME', '')
          if ref.startswith('v'):
              assert ref[1:] == version, f'tag {ref} does not match VERSION {version}'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: Dockerfile.console
          push: true
          tags: ghcr.io/dh666i/dyfire:${{ steps.version.outputs.version }}
          build-args: |
            RUNTIME_BASE=ghcr.io/dh666i/dyfire@sha256:e165f28f2419e695dcf96594bfd8e9cce1fc33de7302c1f98dbe7b63dd95ab40
          labels: org.opencontainers.image.source=https://github.com/dh666i/dyfire
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify release container
        env:
          RELEASE_IMAGE: ghcr.io/dh666i/dyfire@${{ steps.image.outputs.digest }}
        run: docker run --rm --entrypoint python -v "$PWD/deploy/smoke.py:/app/smoke.py:ro" "$RELEASE_IMAGE" /app/smoke.py
      - name: Publish verified release
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: python
        run: |
          import json, os, subprocess
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          manifest = {'version': version, 'schema': 1, 'image': 'ghcr.io/dh666i/dyfire@' + os.environ['RELEASE_DIGEST']}
          body = 'Dyfire ' + version + '\n\n镜像已由 GitHub Actions 构建并通过容器健康检查。服务器更新器只会安装此 Release 中记录的固定镜像摘要。\n\n<!-- dyfire-manifest ' + json.dumps(manifest) + ' -->\n'
          Path('release-notes.tmp').write_text(body, encoding='utf-8')
          tag = 'v' + version
          existing = subprocess.run(['gh', 'release', 'view', tag], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          if existing.returncode == 0:
              subprocess.run(['gh', 'release', 'edit', tag, '--title', 'Dyfire ' + version, '--notes-file', 'release-notes.tmp', '--draft=false', '--prerelease=false'], check=True)
          else:
              subprocess.run(['gh', 'release', 'create', tag, '--target', os.environ['GITHUB_SHA'], '--title', 'Dyfire ' + version, '--notes-file', 'release-notes.tmp'], check=True)
