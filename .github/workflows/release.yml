name: Build private release draft
on:
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: dyfire-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-console.txt pytest
      - run: python -m pytest tests/console/test_release_updates.py tests/console/test_studio_api.py tests/console/test_updater_host.py -q
      - name: Validate version
        id: version
        shell: python
        run: |
          import os, re
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: Dockerfile.console
          push: true
          tags: ghcr.io/dh666i/dyfire:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/dh666i/dyfire
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify release container
        env:
          RELEASE_IMAGE: ghcr.io/dh666i/dyfire@${{ steps.image.outputs.digest }}
        run: docker run --rm --entrypoint python -v "$PWD/deploy/smoke.py:/app/smoke.py:ro" "$RELEASE_IMAGE" /app/smoke.py
      - name: Create release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: python
        run: |
          import json, os, subprocess
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          manifest = {'version': version, 'schema': 1, 'image': 'ghcr.io/dh666i/dyfire@' + os.environ['RELEASE_DIGEST']}
          body = 'Dyfire ' + version + '\n\n请完成部署验收后再发布此草稿。\n\n<!-- dyfire-manifest ' + json.dumps(manifest) + ' -->\n'
          Path('release-notes.tmp').write_text(body, encoding='utf-8')
          subprocess.run(['gh', 'release', 'create', 'v' + version, '--draft', '--target', os.environ['GITHUB_SHA'], '--title', 'Dyfire ' + version, '--notes-file', 'release-notes.tmp'], check=True)
