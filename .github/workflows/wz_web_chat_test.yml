name: Manual WZ web chat probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    environment: user-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the isolated WZ probe
        env:
          WZ_DATA: ${{ secrets.WZ_DATA }}
        run: |
          if [ -f web_chat_probe.py ]; then
            python web_chat_probe.py
          else
            echo "web_chat_probe.py is not part of this repository; no legacy probe was run."
          fi
