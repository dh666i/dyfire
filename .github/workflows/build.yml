name: Validate and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate application version contract
        shell: python
        run: |
          import json
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          package = json.loads(Path('frontend/package.json').read_text())
          lock = json.loads(Path('frontend/package-lock.json').read_text())
          assert package.get('version') == version
          assert lock.get('version') == version
          assert lock.get('packages', {}).get('', {}).get('version') == version
      - run: npm ci && npm run build
        working-directory: frontend
      - run: pip install -r requirements.txt -r requirements-console.txt pytest
      - run: python -m pytest tests/console/test_session_recovery.py tests/console/test_directory.py tests/console/test_account_health.py tests/console/test_health_retry.py tests/console/test_scheduler_worker.py tests/console/test_scheduler_sql.py tests/console/test_worker_sharding.py tests/console/test_executor_session.py tests/console/test_release_updates.py tests/console/test_studio_api.py tests/console/test_subscriptions.py tests/console/test_schedule_slots.py tests/console/test_today_sends.py tests/console/test_updater_host.py tests/console/test_recovery_drill.py tests/console/test_elevation_web.py tests/console/test_mfa.py tests/console/test_audit_traceability.py tests/console/test_commercial_workflows.py tests/console/test_design_system.py tests/console/test_password_policy_web.py tests/console/test_spa_bootstrap_perf.py tests/console/test_admin_web.py tests/console/test_services.py tests/console/test_config_db.py tests/console/test_crypto_security.py tests/console/test_retention.py tests/console/test_data_migration.py tests/test_deployment_paths.py tests/test_postgres_profile.py -q
      - name: Verify shared UI interactions without browser automation
        # Keep the 500-customer data-integrity baseline independent of browser assets.
        run: |
          npm install --prefix "$RUNNER_TEMP/dyfire-ui-tests" --no-save --package-lock=false jsdom@26.1.0
          export NODE_PATH="$RUNNER_TEMP/dyfire-ui-tests/node_modules"
          node tests/console/ui_select_js_harness.js
          node --test frontend/src/navigation.test.js
          node tests/console/design_system_harness.cjs
          node tests/console/task_workspace_harness.cjs
          node tests/console/commercial_ui_harness.cjs
          node tests/console/motion_harness.cjs
          node tests/console/mobile_workspace_harness.cjs
          node tests/console/admin_mobile_layout_harness.cjs
          node tests/console/cloud_frame_state_harness.cjs transient-errors-stay-loading
          node tests/console/cloud_frame_state_harness.cjs timeout-is-explicit
          node tests/console/cloud_frame_state_harness.cjs expiry-is-explicit
          node tests/console/cloud_frame_state_harness.cjs retry-keeps-scan-id
      - name: Verify customer capacity and account-state preservation
        run: python -m pytest tests/console/test_scale_baseline.py tests/console/test_account_scan_web.py tests/console/test_request_context.py tests/console/test_request_limits.py tests/console/test_proxy_headers.py -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.console
          push: false
          load: true
          tags: dyfire:validation
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container application
        run: docker run --rm --entrypoint python -v "$PWD/deploy/smoke.py:/app/smoke.py:ro" dyfire:validation /app/smoke.py
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dyfire
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d dyfire"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt -r requirements-console.txt pytest
      - run: python -m pytest tests/console/test_postgres_schema.py tests/console/test_postgres_migration.py tests/console/test_postgres_scale_baseline.py tests/console/test_postgres_claim_concurrency.py -q -s
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dyfire
  redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt -r requirements-console.txt pytest
      - run: python -m pytest tests/console/test_redis_backend.py tests/console/test_queue_preflight.py tests/console/test_backup_manifest.py tests/console/test_rate_limit.py -q -s
        env:
          TEST_REDIS_URL: redis://localhost:6379/15
