name: Validate and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-console.txt pytest
      - run: python -m pytest tests/console/test_session_recovery.py tests/console/test_directory.py tests/console/test_account_health.py tests/console/test_health_retry.py tests/console/test_scheduler_worker.py tests/console/test_release_updates.py tests/console/test_studio_api.py tests/console/test_updater_host.py tests/console/test_commercial_workflows.py tests/console/test_design_system.py tests/console/test_studio_site.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Verify shared UI interactions without browser automation
        run: |
          npm install --prefix "$RUNNER_TEMP/dyfire-ui-tests" --no-save --package-lock=false jsdom@26.1.0
          export NODE_PATH="$RUNNER_TEMP/dyfire-ui-tests/node_modules"
          node tests/console/ui_select_js_harness.js
          node tests/console/design_system_harness.cjs
          node tests/console/task_workspace_harness.cjs
          node tests/console/commercial_ui_harness.cjs
          node tests/console/motion_harness.cjs
          node tests/console/mobile_workspace_harness.cjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.console
          push: false
          load: true
          tags: dyfire:validation
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container application
        run: docker run --rm --entrypoint python -v "$PWD/deploy/smoke.py:/app/smoke.py:ro" dyfire:validation /app/smoke.py
