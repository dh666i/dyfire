name: Shared quality gate
on:
  workflow_call:
permissions:
  contents: read
  packages: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-console.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt -r requirements-console.txt pip-audit
      - run: npm ci
        working-directory: frontend
      - run: python scripts/check_version.py
      - run: python scripts/export_contracts.py --check
      - run: python scripts/runtime_images.py validate
      - run: node scripts/dedupe_css.mjs --check
      - run: npm run build
        working-directory: frontend
      - run: node --test frontend/src/*.test.js
      - run: pip-audit --strict
      - run: npm audit --audit-level=high
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: validated-frontend
          path: frontend/dist/
          if-no-files-found: error
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    # Each shard has its own services and workspace. Parallel pytest processes
    # must never share the same PostgreSQL database or Redis test namespace.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dyfire
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d dyfire"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NODE_PATH: ${{ github.workspace }}/frontend/node_modules
      DYFIRE_REQUIRE_BROWSER: '1'
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dyfire
      TEST_REDIS_URL: redis://localhost:6379/15
      DYFIRE_TEST_SHARDS: '4'
      DYFIRE_TEST_SHARD: ${{ matrix.shard }}
      DYFIRE_SHARD_EVIDENCE: .artifacts/ci-shard/collection.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-console.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt -r requirements-console.txt pytest
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Run complete isolated suite across deterministic shards
        # Root platform probes need real account data and may send messages.
        # The collection list is audited after every shard completes.
        run: python -m pytest -p scripts.ci_shard tests/console tests/test_deployment_paths.py tests/test_postgres_profile.py -q --junitxml=.artifacts/ci-shard/test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-shard-${{ matrix.shard }}
          path: .artifacts/ci-shard/
          include-hidden-files: true
          if-no-files-found: error
      - name: Preserve isolated browser failure evidence
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence-${{ matrix.shard }}
          path: |
            .artifacts/ui-toast-hover/
            .artifacts/ui-controls-refinement/screenshots/
            .artifacts/ui-site-unification/screenshots/
          retention-days: 7
          include-hidden-files: true
  validate:
    # Retain the existing required-check identity: quality / validate.
    needs: [static, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          pattern: quality-shard-*
          path: .artifacts/quality-evidence
      - run: python -m scripts.ci_shard .artifacts/quality-evidence --commit "$GITHUB_SHA" --shards 4
