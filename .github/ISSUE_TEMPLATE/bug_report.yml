name: 缺陷报告
description: 报告可以在隔离环境中复现的问题
title: "[缺陷] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先删除用户名、抖音账号 ID、Cookie、验证码、兑换码、IP 和日志中的个人数据。安全问题请使用私有渠道，不要创建公开 Issue。
  - type: input
    id: version
    attributes:
      label: Dyfire 版本
      placeholder: 例如 0.4.13
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 提供不会连接真实抖音账号或发送真实消息的最小复现步骤。
      placeholder: |
        1. 打开……
        2. 执行……
        3. 观察……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 部署方式、浏览器和相关服务状态。请勿附带凭据或生产数据。
    validations:
      required: false
